[config]
;是否支持补光灯[0,1]
fill_light_led_support = 0
;0 NIGHT_MODE_AUTO, 1 NIGHT_MODE_IRLED, 2 NIGHT_MODE_COLOR
night_mode_def = 1
;ircut类型[0,2]:0 IRCUT_LINE_TYPE_A,1 IRCUT_LINE_TYPE_A_B,2 IRCUT_LINE_TYPE_A_EN
ircut_type = 2
;ircut gpio引脚
ircut_gpio_a = 42
ircut_gpio_b_en = 41
;ircut_gpio白天夜晚电平[0,1] 
ircut_a_day_level = 1
ircut_b_en_day_level = 1
ircut_a_night_level = 0
ircut_b_en_night_level = 1
;光敏类型[0,1]:0 硬件光敏CDS, 1 软件判断
ps_mode = 1
;硬件光敏类型[0,1]:0 ain, 1 gpio
ps_hw_mode = 0
;硬件光敏gpio引脚,光敏类型是gpio才有效
ps_hw_gpio_id = -1
;硬件光敏白天电平值
ps_hw_day_level = 0
;光敏类型是ain时白天夜晚阈值,
ps_hw_higher_level = 2350
ps_hw_lower_level = 2000
;
ps_auto_day_to_night_lum = 2000
ps_auto_night_to_day_lum = 1000
ps_auto_lock_time = 1800000
ps_auto_night_cnt_1 = 100000
ps_auto_night_cnt_2 = 100000
ps_auto_night_cnt_3 = 100000
ps_auto_night_cnt_4 = 100000
ps_auto_night_cnt_5 = 100000
ps_auto_day_cnt_1 = 1800000
ps_auto_day_cnt_2 = 400000
ps_auto_day_cnt_3 = 400000
ps_auto_day_cnt_4 = 300000
ps_auto_day_cnt_5 = 300000
ps_auto_day_cnt_6 = 300000
ps_auto_day_cnt_7 = 300000
ps_auto_day_cnt_8 = 300000
ps_auto_day_cnt_9 = 300000
ps_auto_day_cnt_10 = 2000000
ps_auto_day2night_sleep_time = 500
ps_auto_night2day_sleep_time = 800

;LED亮时的电平值
red_led_level = 1
blue_led_level = 1
state_led_level = 1
ir_led_level = 1
;sensor是否倒置[0,1]
sensor_inv = 1
;马达转向是否反向[0,1]
pan_clkwise_inv = 0
tilt_clkwise_inv = 0
;镜头类型[0,1]:0 普通镜头, 1 鱼眼镜头
lens_type = 0
;网络类型[0,2]:0 wifi, 1 有线，2 有线加wifi
net_mode = 0
;喇叭开关控制GPIO
audio_speak_en_gpio = 82
;0 F37 DVP, 1 F37 MIPI, 2 F37P DVP, 3 F37P MIPI, 4 MIS2006 MIPI, 5 MIS2006 DVP
;6 GC2063 DVP,7 GC2063 MIPI,11 MIS2008, 20 SC2336
sensor_type_def = 17
;[video]
main_width = 1920
main_height = 1080
main_fps = 15
main_goplen = 30
main_target_kbps = 768
main_max_kbps    = 768
;[0,3]:0 固定QP, 1 CBR, 2 VBR, 3 限制I帧大小
main_br_mode     = 1
main_minqp       = 25
main_maxqp       = 45
main_enc_level        = 50;
;[0,2]:0 h264, 1 mjpeg, 2 h265
main_enc_out_type = 0

sub_width = 640
sub_height = 360
sub_fps = 15
sub_goplen = 30
sub_target_kbps = 512
sub_max_kbps    = 512
;[0,3]:0 固定QP, 1 CBR, 2 VBR, 3 限制I帧大小
sub_br_mode     = 2
sub_minqp       = 25
sub_maxqp       = 45
sub_enc_level        = 30;
;[0,2]:0 h264, 1 mjpeg, 2 h265
sub_enc_out_type = 0

;[motion detect setting]
;[1, 100]
md_level_low = 20
md_level_mid = 50
md_level_high = 80
;[sound detect setting]
;[1, 100]
sd_level_low = 45
sd_level_mid = 50
sd_level_high = 55

;[0, 2]人型过滤，0 不支持, 1 使用ruixing算法, 2 使用阿里算法
human_filter_support = 1
;[1, 100]检测结果可信度阈值
hd_threshode_level_low = 80
hd_threshode_level_mid = 90
hd_threshode_level_high = 100

;是否支持PWM灯[0,1]
pwm_led_support = 1
pwm_led_num = 0

ble_config_support = 1

